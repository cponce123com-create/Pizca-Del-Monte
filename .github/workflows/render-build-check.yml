name: Render Build Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/**'
      - 'packages/**'
      - 'prisma/**'
      - '.github/workflows/render-build-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/**'
      - 'packages/**'
      - 'prisma/**'
      - '.github/workflows/render-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Print Node and pnpm versions
        run: node --version && pnpm --version
      - name: Install dependencies (Render)
        run: pnpm install --frozen-lockfile
      - name: Verify Tailwind plugins
        run: |
          pnpm --filter @pizca/web exec node -e "for (const name of ['@tailwindcss/forms', '@tailwindcss/typography', '@tailwindcss/aspect-ratio', '@tailwindcss/container-queries']) require.resolve(name)"
      - name: Validate Prisma schema
        run: pnpm --filter @pizca/database exec prisma validate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://diagnostic:diagnostic@localhost:5432/pizca
      - name: Generate Prisma client (Render)
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://diagnostic:diagnostic@localhost:5432/pizca
      - name: Verify TypeScript (required)
        env:
          DATABASE_URL: postgresql://diagnostic:diagnostic@localhost:5432/pizca
        run: pnpm --filter @pizca/web exec tsc --noEmit --pretty false
      - name: Build storefront (Render)
        run: pnpm --filter @pizca/web build
        env:
          DATABASE_URL: postgresql://diagnostic:diagnostic@localhost:5432/pizca
          NEXTAUTH_SECRET: diagnostic-secret-for-build-only
          NEXTAUTH_URL: http://localhost:3000
