name: Repair Prisma reverse relations (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-prisma-relations.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and repair relations via Prisma
        run: pnpm --filter @pizca/database exec prisma format --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://diagnostic:diagnostic@localhost:5432/pizca
      - name: Validate the formatted Prisma schema
        run: pnpm --filter @pizca/database exec prisma validate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://diagnostic:diagnostic@localhost:5432/pizca
      - name: Commit fixed schemas
        run: |
          cp packages/database/prisma/schema.prisma prisma/schema.prisma
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma/schema.prisma prisma/schema.prisma
          if ! git diff --cached --quiet; then
            git commit -m "fix(prisma): format and repair model reverse relations"
            git push origin HEAD:main
          fi
