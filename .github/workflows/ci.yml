name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Lint, Types and Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pizca_ci
      NEXTAUTH_SECRET: ci-only-not-for-production-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: pnpm
      - name: Install all dependencies
        run: pnpm install --frozen-lockfile --prod=false --ignore-scripts
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Lint web
        run: pnpm --filter @pizca/web lint
      - name: Type check web
        run: pnpm --filter @pizca/web type-check
      - name: Type check admin
        run: pnpm --filter @pizca/admin type-check
      - name: Type check shared packages
        run: pnpm --filter @pizca/utils type-check && pnpm --filter @pizca/database type-check
      - name: Test web
        run: pnpm --filter @pizca/web exec jest --runInBand
      - name: Test admin
        run: pnpm --filter @pizca/admin exec jest --runInBand
      - name: Build web
        run: pnpm --filter @pizca/web build
      - name: Build admin
        run: pnpm --filter @pizca/admin build
  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false --ignore-scripts
      - run: pnpm audit --prod --audit-level=moderate
