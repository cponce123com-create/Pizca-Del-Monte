name: Refresh pnpm lockfile (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-lockfile.yml'
      - 'apps/web/package.json'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and regenerate lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Ensure lockfile exists
        run: test -s pnpm-lock.yaml
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build: update pnpm lockfile for Next.js dependencies"
            git push origin HEAD:main
          fi
